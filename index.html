<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro 2033 - Universe Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Header Bar (Search + Artyom Journey Button) -->
    <div id="search-container">
        <div id="header-bar-row">
            <div id="search-wrapper">
                <svg id="search-icon" viewBox="0 0 24 24" width="20" height="20">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
                    <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search for a station..." autocomplete="off" autofocus>
                <button id="clear-search" class="hidden" title="Clear search">&times;</button>
            </div>

            <!-- Artyom Journey Button -->
            <div id="artyom-panel">
                <button id="artyom-btn" type="button" title="Step through Artyom's journey from VDNKh to Polis and D-6">
                    <span class="artyom-btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 64 64" width="28" height="28">
                            <path d="M12 27 C12 12, 52 12, 52 27 L54 34 C54 44, 46 52, 32 54 C18 52, 10 44, 10 34 Z" fill="#2b3530" stroke="#cbd5e1" stroke-width="2.5"/>
                            <path d="M17 21 C23 14, 41 14, 47 21" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="23" cy="29" r="7.5" fill="#0f172a" stroke="#e2e8f0" stroke-width="2.4"/>
                            <circle cx="41" cy="29" r="7.5" fill="#0f172a" stroke="#e2e8f0" stroke-width="2.4"/>
                            <circle cx="23" cy="29" r="5.2" fill="#22c55e" opacity="0.9"/>
                            <circle cx="41" cy="29" r="5.2" fill="#22c55e" opacity="0.9"/>
                            <path d="M20 26 A3.5 3.5 0 0 1 25 25" fill="none" stroke="#dcfce7" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M38 26 A3.5 3.5 0 0 1 43 25" fill="none" stroke="#dcfce7" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="30.5" y1="29" x2="33.5" y2="29" stroke="#94a3b8" stroke-width="2.5"/>
                            <polygon points="7,38 17,34 19,44 9,48" fill="#475569" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
                            <polygon points="57,38 47,34 45,44 55,48" fill="#475569" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
                            <circle cx="32" cy="44" r="7.5" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.4"/>
                            <circle cx="32" cy="44" r="4" fill="#334155"/>
                            <line x1="32" y1="38.5" x2="32" y2="49.5" stroke="#94a3b8" stroke-width="1.5"/>
                            <line x1="26.5" y1="44" x2="37.5" y2="44" stroke="#94a3b8" stroke-width="1.5"/>
                        </svg>
                    </span>
                    <span class="artyom-btn-content">
                        <span class="artyom-btn-title">Artyom's Journey</span>
                        <span id="artyom-btn-status" class="artyom-btn-status">Start at VDNKh</span>
                    </span>
                    <span id="artyom-btn-flag" class="artyom-btn-flag hidden" title="Journey Complete!">
                        <svg viewBox="0 0 32 32" width="20" height="20">
                            <line x1="5" y1="4" x2="5" y2="29" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
                            <g stroke="#0f172a" stroke-width="0.6">
                                <rect x="6" y="5" width="5.5" height="4.5" fill="#ffffff"/>
                                <rect x="11.5" y="5" width="5.5" height="4.5" fill="#0f172a"/>
                                <rect x="17" y="5" width="5.5" height="4.5" fill="#ffffff"/>
                                <rect x="22.5" y="5" width="5.5" height="4.5" fill="#0f172a"/>
                                <rect x="6" y="9.5" width="5.5" height="4.5" fill="#0f172a"/>
                                <rect x="11.5" y="9.5" width="5.5" height="4.5" fill="#ffffff"/>
                                <rect x="17" y="9.5" width="5.5" height="4.5" fill="#0f172a"/>
                                <rect x="22.5" y="9.5" width="5.5" height="4.5" fill="#ffffff"/>
                                <rect x="6" y="14" width="5.5" height="4.5" fill="#ffffff"/>
                                <rect x="11.5" y="14" width="5.5" height="4.5" fill="#0f172a"/>
                                <rect x="17" y="14" width="5.5" height="4.5" fill="#ffffff"/>
                                <rect x="22.5" y="14" width="5.5" height="4.5" fill="#0f172a"/>
                            </g>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
        <div id="search-results" class="hidden"></div>
    </div>

    <!-- Map Container -->
    <div id="map-viewport">
        <div id="map-container">
            <img id="map-image" src="plan.svg" width="3709" height="3530" alt="Metro 2033 Universe Map" draggable="false">
            <svg id="artyom-journey-svg" viewBox="0 0 3709 3530" preserveAspectRatio="none"></svg>
            <div id="stations-overlay"></div>
            <div id="artyom-head-marker" class="hidden" aria-hidden="true"></div>
            <div id="artyom-flag-marker" class="hidden" aria-hidden="true"></div>
            <div id="highlight-ring" class="hidden"></div>
        </div>
    </div>

    <!-- Station Info Modal (Right Panel) -->
    <aside id="station-modal" class="station-modal hidden" aria-hidden="true">
        <div class="station-modal-header">
            <div class="station-modal-title-group">
                <div class="station-modal-badges">
                    <span id="modal-line-badge" class="station-badge-line"></span>
                    <span id="modal-faction-badge" class="station-badge-faction"></span>
                </div>
                <h2 id="modal-station-name"></h2>
                <div id="modal-station-subtitle" class="station-modal-subtitle"></div>
            </div>
            <div class="station-modal-actions">
                <button id="modal-expand-btn" class="station-modal-expand" title="Expand station details" aria-label="Expand station details" aria-expanded="false">
                    <span id="modal-expand-arrow">▲</span>
                </button>
                <button id="modal-close-btn" class="station-modal-close" title="Close station details" aria-label="Close station details">&times;</button>
            </div>
        </div>

        <div class="station-modal-body">
            <div id="modal-image-container" class="station-modal-image-wrapper">
                <div id="modal-image-loader" class="station-image-loader">
                    <div class="spinner"></div>
                    <span>Loading from Metro Wiki...</span>
                </div>
                <img id="modal-station-image" src="" alt="" referrerpolicy="no-referrer" class="hidden">
                <div id="modal-image-caption" class="station-image-caption hidden"></div>
            </div>

            <div id="modal-infobox-meta" class="station-infobox-grid hidden"></div>

            <div class="station-modal-text-section">
                <div id="modal-text-loader" class="station-text-loading hidden">
                    <div class="spinner-small"></div>
                    <span>Fetching Metro Wiki article...</span>
                </div>
                <div id="modal-station-text" class="station-modal-text"></div>
            </div>
        </div>

        <div class="station-modal-footer">
            <a id="modal-wiki-link" href="https://metrovideogame.fandom.com/wiki/Stations" target="_blank" rel="noopener noreferrer">
                <span id="modal-wiki-link-label">View on Metro Wiki</span>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
            </a>
        </div>
    </aside>

    <!-- Legend Toggle -->
    <div id="legend-panel">
        <button id="legend-toggle">
            <span id="legend-arrow">▲</span>
            <span>Map Legend</span>
        </button>
        <div id="legend-content" class="collapsed">
            <div id="legend-grid"></div>
        </div>
    </div>

    <script src="stations.js"></script>
    <script src="legend.js"></script>
    <script src="app.js"></script>
</body>
</html>
